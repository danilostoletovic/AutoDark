name: Build and release
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore AutoDark.csproj
      - run: dotnet build AutoDark.csproj --configuration Release --no-restore -warnaserror
      - name: Focused automated tests
        shell: pwsh
        run: |
          dotnet bin/Release/net10.0-windows10.0.19041.0/AutoDark.dll --self-test
          if ($LASTEXITCODE -ne 0) { throw 'AutoDark tests failed' }
      - run: dotnet publish AutoDark.csproj --configuration Release --runtime win-x64 --self-contained true -o artifacts/win-x64 -warnaserror
      - name: Archive portable application
        shell: pwsh
        run: Compress-Archive -Path artifacts/win-x64/* -DestinationPath artifacts/AutoDark-win-x64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AutoDark-win-x64
          path: artifacts/AutoDark-win-x64.zip
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: AutoDark-win-x64
          path: artifacts
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$env:RELEASE_TAG" artifacts/AutoDark-win-x64.zip --verify-tag --generate-notes
