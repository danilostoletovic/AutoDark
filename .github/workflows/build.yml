name: Build and release
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
concurrency:
  group: autodark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2025
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Validate version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          . ./scripts/ReleaseTools.ps1
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = Get-ReleaseVersion $env:RELEASE_TAG
          } else {
            [xml]$project = Get-Content AutoDark.csproj -Raw
            $version = Get-ReleaseVersion ('v' + $project.Project.PropertyGroup.Version)
          }
          "version=$($version.Version)" >> $env:GITHUB_OUTPUT
      - run: dotnet restore AutoDark.csproj
      - run: dotnet build AutoDark.csproj -c Release --no-restore -warnaserror
      - name: Automated tests
        shell: pwsh
        run: |
          dotnet bin/Release/net10.0-windows10.0.19041.0/AutoDark.dll --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Application tests failed' }
          ./scripts/Test-ReleaseTools.ps1
      - name: Publish and validate EXE and ZIP
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/Build-Portable.ps1 -Tag $env:RELEASE_TAG
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: AutoDark-release
          overwrite: true
          path: |
            artifacts/release/AutoDark.exe
            artifacts/release/AutoDark-win-x64.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: AutoDark-release
          path: artifacts
      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          foreach ($path in @('artifacts/AutoDark.exe','artifacts/AutoDark-win-x64.zip')) {
            if (!(Test-Path -LiteralPath $path) -or (Get-Item -LiteralPath $path).Length -eq 0) { throw "Missing release asset: $path" }
          }
          $null = gh release view "$env:RELEASE_TAG" --json tagName 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:RELEASE_TAG" --verify-tag --draft --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload "$env:RELEASE_TAG" artifacts/AutoDark.exe artifacts/AutoDark-win-x64.zip --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed; new release remains a draft' }
          gh release edit "$env:RELEASE_TAG" --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
  store:
    if: startsWith(github.ref, 'refs/tags/v') && vars.STORE_PACKAGING_ENABLED == 'true'
    needs: build
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: AutoDark-release
          path: artifacts/input
      - name: Check private artifact prerequisite
        shell: pwsh
        env:
          STORE_ARTIFACT_KEY_BASE64: ${{ secrets.STORE_ARTIFACT_KEY_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:STORE_ARTIFACT_KEY_BASE64)) { throw 'Store enabled but STORE_ARTIFACT_KEY_BASE64 secret is missing' }
          if ([Convert]::FromBase64String($env:STORE_ARTIFACT_KEY_BASE64).Length -ne 32) { throw 'Store artifact secret must encode 32 random bytes' }
      - name: Package and validate Store submission candidate
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
        run: ./scripts/Build-Store.ps1 -Tag $env:RELEASE_TAG -Executable artifacts/input/AutoDark.exe
      - name: Encrypt Store artifact for private retrieval
        shell: pwsh
        env:
          STORE_ARTIFACT_KEY_BASE64: ${{ secrets.STORE_ARTIFACT_KEY_BASE64 }}
        run: |
          $package = @(Get-ChildItem artifacts/store/*.msix)
          if ($package.Count -ne 1) { throw 'Expected exactly one validated Store package' }
          ./scripts/Protect-StoreArtifact.ps1 -Mode Encrypt -InputFile $package[0].FullName -OutputFile ($package[0].FullName + '.enc')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: AutoDark-Store-submission-${{ needs.build.outputs.version }}
          overwrite: true
          path: artifacts/store/*.msix.enc
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
